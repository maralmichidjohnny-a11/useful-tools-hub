<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer | Useful Tools Hub</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
    <h1>⏱️ Countdown Timer</h1>
    <p>Set a timer for minutes and seconds.</p>
</header>

<main>
    <div class="tool">

        <input id="minutes" type="number" min="0" placeholder="Minutes">

        <input id="seconds" type="number" min="0" max="59" placeholder="Seconds">

        <button onclick="startTimer()">Start</button>
        <button onclick="pauseTimer()">Pause</button>
        <button onclick="resetTimer()">Reset</button>

        <h2 id="display">00:00</h2>

        <a href="../index.html">← Back to all tools</a>

    </div>
</main>

<script>
let timer;
let timeLeft = 0;

function startTimer() {
    if (timeLeft <= 0) {
        const minutes = Number(document.getElementById("minutes").value) || 0;
        const seconds = Number(document.getElementById("seconds").value) || 0;

        timeLeft = (minutes * 60) + seconds;
    }

    if (timeLeft <= 0) {
        return;
    }

    clearInterval(timer);

    updateDisplay();

    timer = setInterval(function() {

        timeLeft--;

        updateDisplay();

        if (timeLeft <= 0) {
            clearInterval(timer);
            timeLeft = 0;
            updateDisplay();
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(timer);
}

function resetTimer() {
    clearInterval(timer);
    timeLeft = 0;

    document.getElementById("minutes").value = "";
    document.getElementById("seconds").value = "";

    updateDisplay();
}

function updateDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    document.getElementById("display").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");
}
</script>

</body>
</html>
